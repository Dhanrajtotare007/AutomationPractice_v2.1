<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="QA Automation Labs UI Automation Playground - a free, interactive practice environment to master Playwright, Selenium and Cypress locators, waits and assertions."
    />
    <meta name="theme-color" content="#8f1f3a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>QA Automation Labs | UI Automation Playground</title>
    <script>
      // Apply the saved theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem('qa-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = saved ? saved === 'dark' : prefersDark;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* storage unavailable - keep light theme */
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
